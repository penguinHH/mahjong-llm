<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680">
<style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F7F6F2;stroke:#B4B2A9}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-coral rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.arr{stroke:#888780;stroke-width:1.2;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="680" fill="#FFFFFF"/>

<rect class="box" x="40" y="40" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="130" y="58" text-anchor="middle" dominant-baseline="central">牌谱局面</text>
<text class="ts" x="130" y="78" text-anchor="middle" dominant-baseline="central">58×34 平面 + 71 标量</text>
<rect class="box" x="250" y="40" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">指令文字</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">任务说明 + 合法手</text>
<rect class="box" x="460" y="40" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="550" y="58" text-anchor="middle" dominant-baseline="central">牌桌图片</text>
<text class="ts" x="550" y="78" text-anchor="middle" dominant-baseline="central">1024×768 渲染</text>

<g class="c-gray">
<rect x="40" y="140" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="130" y="158" text-anchor="middle" dominant-baseline="central">CNN 局面编码器</text>
<text class="ts" x="130" y="178" text-anchor="middle" dominant-baseline="central">第 0 步训好，冻结</text>
</g>
<g class="c-coral">
<rect x="460" y="140" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="550" y="158" text-anchor="middle" dominant-baseline="central">视觉塔 ViT</text>
<text class="ts" x="550" y="178" text-anchor="middle" dominant-baseline="central">约 1 亿参数，LoRA</text>
</g>
<g class="c-teal">
<rect x="40" y="240" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="130" y="258" text-anchor="middle" dominant-baseline="central">投影层 MLP</text>
<text class="ts" x="130" y="278" text-anchor="middle" dominant-baseline="central">192 → 1024 维</text>
<rect x="460" y="240" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="550" y="258" text-anchor="middle" dominant-baseline="central">视觉合并层</text>
<text class="ts" x="550" y="278" text-anchor="middle" dominant-baseline="central">3072 块 → 768 token</text>
</g>

<rect class="box" x="40" y="340" width="600" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="340" y="358" text-anchor="middle" dominant-baseline="central">拼成一条 token 序列</text>
<text class="ts" x="340" y="378" text-anchor="middle" dominant-baseline="central">35 个局面向量 · 768 个图像 token · 指令文字</text>

<g class="c-coral">
<rect x="160" y="440" width="360" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="340" y="458" text-anchor="middle" dominant-baseline="central">Qwen3.5-0.8B 语言模型</text>
<text class="ts" x="340" y="478" text-anchor="middle" dominant-baseline="central">24 层，LoRA r=8</text>
</g>
<rect class="box" x="200" y="540" width="280" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="340" y="558" text-anchor="middle" dominant-baseline="central">答案与损失</text>
<text class="ts" x="340" y="578" text-anchor="middle" dominant-baseline="central">理由 + 动作，只算答案 token</text>

<line x1="130" y1="96" x2="130" y2="138" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="196" x2="130" y2="238" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="296" x2="130" y2="338" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="96" x2="550" y2="138" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="196" x2="550" y2="238" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="296" x2="550" y2="338" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="340" y2="338" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="396" x2="340" y2="438" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="496" x2="340" y2="538" class="arr" marker-end="url(#arrow)"/>

<rect class="c-gray" x="150" y="630" width="16" height="16" rx="3" stroke-width="0.8"/>
<text class="ts" x="174" y="638" dominant-baseline="central">冻结</text>
<rect class="c-coral" x="270" y="630" width="16" height="16" rx="3" stroke-width="0.8"/>
<text class="ts" x="294" y="638" dominant-baseline="central">LoRA 微调</text>
<rect class="c-teal" x="410" y="630" width="16" height="16" rx="3" stroke-width="0.8"/>
<text class="ts" x="434" y="638" dominant-baseline="central">全参训练</text>
</svg>
