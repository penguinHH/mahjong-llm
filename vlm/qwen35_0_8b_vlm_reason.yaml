### VLM 路线：牌桌画面（render_board.py 渲染，1024×768）→ Qwen3.5 自带视觉塔 → LLM → 动作。不经过局面编码器。
### 标签 = Mortal 的动作 + 程序生成的事实理由（与 mmj 第 2 步同一套目标），可直接和"编码器 + LLM"比较
### 像素输入与完美局面输入的差距。视觉塔和视觉投影层解冻，让它学会"看麻将牌"。
### model
model_name_or_path: Qwen/Qwen3.5-0.8B
trust_remote_code: true
image_max_pixels: 786432          # 1024×768 原尺寸，不缩小（默认 768×768 会把小牌面缩糊）

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
freeze_vision_tower: false
freeze_multi_modal_projector: false

### dataset
dataset_dir: /home/user/mahjong-llm/work/vlm
dataset: vlm_mortal_reason_train
template: qwen3_5_nothink
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4
tokenized_path: /home/user/mahjong-llm/work/vlm/tok_reason  # 预处理结果存盘，续训 / 重跑不用再花 1 小时以上

### output
output_dir: /home/user/mahjong-llm/work/ckpt/qwen35-0.8b-vlm-mortal-reason
logging_steps: 10
save_strategy: steps
save_steps: 200
save_only_model: false
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 8          # 原 2×8；有效 batch 仍 16，实测每步快约 1.8 倍、显存峰值约 3.7GB
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
enable_liger_kernel: true
torch_empty_cache_steps: 50

### eval
val_size: 1000
per_device_eval_batch_size: 1      # 验证不走 liger 融合损失，整段 logits（词表 24.8 万）会实体化；8 条一批在第 400 步爆显存
eval_strategy: steps
eval_steps: 400
